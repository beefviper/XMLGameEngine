<svg xmlns="http://www.w3.org/2000/svg" width="192" height="128" viewBox="0 0 192 128">
  <!-- prismsheet.svg: Prism Fall's sprite sheet, 32 by 32 unit cells, six
       across and four down; each picture's frames run left to right.
       Drawn for this project; MIT, as the repository.

       row 0   lens (0,0), beam (1,0), spark (2,0), comet (3,0) (4,0) (5,0)
       row 1   flash (0,1) (1,1) (2,1) (3,1)
       row 2   diamond (0,2) (1,2) (2,2), ring (3,2) (4,2) (5,2)
       row 3   cross (0,3) (1,3) (2,3) -->

  <g id="backdrop">
    <rect width="192" height="128" fill="#0b0f1a" />
    <path d="M32 0V128 M64 0V128 M96 0V128 M128 0V128 M160 0V128 M0 32H192 M0 64H192 M0 96H192"
          stroke="#1c2436" stroke-width="0.5" />
  </g>

  <!-- row 0 -->
  <g id="lens">
    <polygon points="16,6 18,12 26,16 30,24 2,24 6,16 14,12" fill="#0e3b46" stroke="#3fe8ff" stroke-width="1.2" stroke-linejoin="round" />
    <ellipse cx="16" cy="18" rx="5" ry="3" fill="#bff8ff" />
    <rect x="15" y="2" width="2" height="5" fill="#3fe8ff" />
  </g>
  <g id="beam">
    <rect x="46" y="4" width="4" height="24" rx="2" fill="#9ff6ff" />
    <rect x="47.25" y="6" width="1.5" height="20" fill="#ffffff" />
  </g>
  <g id="spark">
    <polyline points="80,6 76,11 84,16 76,21 80,26" fill="none" stroke="#ffe14d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" />
  </g>
  <g id="comet">
    <g transform="translate(96,0)">
      <path d="M2 16 L18 11 L18 21 Z" fill="#ff9a3c" opacity="0.5" />
      <circle cx="22" cy="16" r="6" fill="#ffb347" />
      <circle cx="23" cy="15" r="3" fill="#fff3c4" />
    </g>
    <g transform="translate(128,0)">
      <path d="M2 14 L18 10 L18 22 L4 19 Z" fill="#ff9a3c" opacity="0.6" />
      <circle cx="22" cy="16" r="6" fill="#ffb347" />
      <circle cx="21" cy="17" r="3" fill="#fff3c4" />
    </g>
    <g transform="translate(160,0)">
      <path d="M2 18 L18 11 L18 21 L4 13 Z" fill="#ff9a3c" opacity="0.55" />
      <circle cx="22" cy="16" r="6" fill="#ffb347" />
      <circle cx="22" cy="14" r="3" fill="#fff3c4" />
    </g>
  </g>

  <!-- row 1: a shard breaking, larger each frame -->
  <g id="flash" fill="none" stroke="#ffffff" stroke-linecap="round">
    <g transform="translate(0,32)" stroke-width="2">
      <path d="M16 12V20 M12 16H20" />
    </g>
    <g transform="translate(32,32)" stroke-width="2">
      <path d="M16 8V24 M8 16H24 M11 11L21 21 M21 11L11 21" />
    </g>
    <g transform="translate(64,32)" stroke-width="1.6">
      <path d="M16 4V11 M16 21V28 M4 16H11 M21 16H28 M7 7L11 11 M25 7L21 11 M7 25L11 21 M25 25L21 21" />
    </g>
    <g transform="translate(96,32)" stroke-width="1.2" opacity="0.6">
      <path d="M16 2V6 M16 26V30 M2 16H6 M26 16H30 M5 5L8 8 M27 5L24 8 M5 27L8 24 M27 27L24 24" />
    </g>
  </g>

  <!-- row 2: the diamond turning, then the ring pulsing -->
  <g id="diamond">
    <polygon points="16,3 29,16 16,29 3,16" fill="#c03bc8" stroke="#ff8bf5" stroke-width="1.2" transform="translate(0,64)" />
    <polygon points="16,3 24,16 16,29 8,16" fill="#c03bc8" stroke="#ff8bf5" stroke-width="1.2" transform="translate(32,64)" />
    <polygon points="16,3 19,16 16,29 13,16" fill="#c03bc8" stroke="#ff8bf5" stroke-width="1.2" transform="translate(64,64)" />
  </g>
  <g id="ring" fill="none" stroke="#ffd93b">
    <circle cx="112" cy="80" r="12" stroke-width="4" />
    <circle cx="144" cy="80" r="11" stroke-width="5" />
    <circle cx="176" cy="80" r="12" stroke-width="3" />
  </g>

  <!-- row 3: the cross spinning -->
  <g id="cross" fill="#ff8a1f" stroke="#ffd0a0" stroke-width="1">
    <path d="M12 3H20V12H29V20H20V29H12V20H3V12H12Z" transform="translate(0,96)" />
    <path d="M12 3H20V12H29V20H20V29H12V20H3V12H12Z" transform="translate(32,96) rotate(30 16 16)" />
    <path d="M12 3H20V12H29V20H20V29H12V20H3V12H12Z" transform="translate(64,96) rotate(60 16 16)" />
  </g>
</svg>
